language: "rust"
layer: "application"

env:
  CARGO_TERM_COLOR: "always"

fileGroups:
  sources:
    - "apps/**/*"
    - "contracts/**/*"
    - "crates/**/*"
    - "Cargo.toml"
    - "Cargo.lock"

tasks:
  build:
    command: "cargo build --locked --workspace"
    inputs:
      - "group://sources"

  check:
    command: "cargo check --locked --workspace"
    inputs:
      - "group://sources"

  format:
    command: "cargo fmt --all --check"
    inputs:
      - "group://sources"

  test:
    command: "cargo test --locked --workspace"
    inputs:
      - "group://sources"
