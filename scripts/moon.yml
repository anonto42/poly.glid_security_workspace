language: "bash"
layer: "automation"

tasks:
  validate:
    command: "ci/validate-automation.sh"
    inputs:
      - "**/*"
      - "/.github/workflows/*.yml"
      - "/.moon/**/*.yml"
      - "/.prototools"
      - "/.release-please-manifest.json"
      - "/Cargo.toml"
      - "/flake.lock"
      - "/flake.nix"
      - "/release-please-config.json"
      - "/version.txt"
    options:
      cache: false
      runInCI: "affected"
