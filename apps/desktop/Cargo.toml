[package]
name = "polyglid-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first workspace project manager and execution control plane"

[features]
default = ["dioxus-ui"]
dioxus-ui = ["dep:dioxus"]

[dependencies]
dioxus = { version = "0.7", features = ["desktop"], optional = true }
polyglid-client = { path = "../../crates/client" }
rfd = "0.15"
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "polyglid-desktop"
path = "src/main.rs"
test = false
required-features = ["dioxus-ui"]

[lints.rust]
unsafe_code = "forbid"
