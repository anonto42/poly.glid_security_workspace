name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    name: Validate Nix development shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Check flake definition
        run: nix flake check --no-build

  release-intent:
    name: Validate release intent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate conventional pull request title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/validate-release-intent.sh

  rust:
    name: Run affected Moon tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Dioxus desktop dependencies
        run: scripts/ci/install-linux-desktop-dependencies.sh
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Install pinned Dioxus CLI
        run: scripts/ci/install-dioxus-cli.sh
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - uses: Swatinem/rust-cache@v2
      - name: Run affected checks
        run: moon ci --downstream deep
      - name: Upload Moon CI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moon-ci-report
          path: .moon/cache/ciReport.json
          if-no-files-found: ignore
          retention-days: 7
