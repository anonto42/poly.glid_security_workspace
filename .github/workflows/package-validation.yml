name: Package validation

on:
  workflow_dispatch:

concurrency:
  group: package-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Validate ${{ matrix.asset }} packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
            archive: polyglid-linux-x86_64.tar.gz
            appimage: polyglid-linux-x86_64.AppImage
          - os: windows-latest
            asset: windows-x86_64
            archive: polyglid-windows-x86_64.zip
            msi: polyglid-windows-x86_64.msi
          - os: macos-15
            asset: macos-aarch64
            archive: polyglid-macos-aarch64.tar.gz
            dmg: polyglid-macos-aarch64.dmg
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-desktop-dependencies.sh
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-validation-${{ matrix.asset }}
      - name: Build desktop
        run: cargo build --locked --release -p polyglid-desktop
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: scripts/release/package-unix.sh ${{ matrix.archive }}
      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/package-windows.ps1 -Archive ${{ matrix.archive }}
      - name: Install WiX v4
        if: matrix.msi != ''
        shell: pwsh
        run: |
          dotnet tool install --global wix
          "$(Join-Path $env:USERPROFILE '.dotnet\tools')" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package Windows MSI
        if: matrix.msi != ''
        shell: pwsh
        run: scripts/release/package-windows-msi.ps1 -PackageDirectory package -Archive ${{ matrix.msi }} -Version (Get-Content version.txt).Trim()
      - name: Package Linux AppImage
        if: matrix.appimage != ''
        run: scripts/release/package-appimage.sh ${{ matrix.appimage }}
      - name: Package macOS DMG
        if: matrix.dmg != ''
        run: scripts/release/package-macos-dmg.sh ${{ matrix.dmg }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-validation-${{ matrix.asset }}-archive
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: matrix.appimage != ''
        with:
          name: package-validation-${{ matrix.asset }}-appimage
          path: ${{ matrix.appimage }}
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: matrix.msi != ''
        with:
          name: package-validation-${{ matrix.asset }}-msi
          path: ${{ matrix.msi }}
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: matrix.dmg != ''
        with:
          name: package-validation-${{ matrix.asset }}-dmg
          path: ${{ matrix.dmg }}
          if-no-files-found: error
          retention-days: 3
