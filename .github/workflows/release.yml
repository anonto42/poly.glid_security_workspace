name: Reusable · Promote PolyGlid release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.10.2
        required: true
        type: string
      signing_public_key:
        description: Hex-encoded Ed25519 public key for the official Recon publisher
        required: true
        type: string
    secrets:
      signing_private_seed:
        description: Hex-encoded 32-byte Ed25519 private seed
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: polyglid-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, sign, publish, and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - id: preflight
        name: Validate tag and resolve exact-commit candidates
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look exactly like v0.10.2"
            exit 1
          fi
          version="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$cargo_version" = "$version" || {
            echo "::error::Tag $TAG does not match workspace version v$cargo_version"
            exit 1
          }
          plugin_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' plugins/recon-probe/polyglid.toml | head -n 1)
          test "$plugin_version" = "$version" || {
            echo "::error::Recon Probe manifest version $plugin_version does not match v$version"
            exit 1
          }
          resolved=$(git rev-parse "$TAG^{commit}")
          test "$resolved" = "$GITHUB_SHA" || {
            echo "::error::The validated commit does not match $TAG"
            exit 1
          }
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::$TAG must point to a commit contained in $DEFAULT_BRANCH"
            exit 1
          }

          runs=$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch="$DEFAULT_BRANCH" \
            -f event=push \
            -f status=success \
            -f per_page=100)
          candidate_run_id=
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            artifacts=$(gh api --paginate \
              "repos/$GH_REPO/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name')
            complete=true
            for expected in \
              release-candidate-linux-x86_64 \
              release-candidate-windows-x86_64 \
              release-candidate-macos-x86_64 \
              release-candidate-macos-aarch64 \
              release-candidate-recon-probe; do
              if ! grep -Fxq "$expected" <<<"$artifacts"; then
                complete=false
                break
              fi
            done
            if [ "$complete" = "true" ]; then
              candidate_run_id=$run_id
              break
            fi
          done < <(jq -r --arg sha "$GITHUB_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha) | .id' \
            <<<"$runs")
          test -n "$candidate_run_id" || {
            echo "::error::No successful main-branch CI run with complete, unexpired release candidates exists for $GITHUB_SHA"
            exit 1
          }

          candidate=$(gh api "repos/$GH_REPO/actions/runs/$candidate_run_id")
          test "$(jq -r .head_sha <<<"$candidate")" = "$GITHUB_SHA"
          test "$(jq -r .head_branch <<<"$candidate")" = "$DEFAULT_BRANCH"
          test "$(jq -r .event <<<"$candidate")" = "push"
          test "$(jq -r .conclusion <<<"$candidate")" = "success"

          echo "Using release candidates from run $candidate_run_id"
          echo "candidate_run_id=$candidate_run_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download exact-commit release candidates
        env:
          CANDIDATE_RUN_ID: ${{ steps.preflight.outputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for artifact in \
            release-candidate-linux-x86_64 \
            release-candidate-windows-x86_64 \
            release-candidate-macos-x86_64 \
            release-candidate-macos-aarch64 \
            release-candidate-recon-probe; do
            gh run download "$CANDIDATE_RUN_ID" --repo "$GH_REPO" --name "$artifact" --dir "artifacts/$artifact"
          done

      - name: Verify candidate identity
        shell: bash
        env:
          SIGNING_PUBLIC_KEY: ${{ inputs.signing_public_key }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          metadata=artifacts/release-candidate-recon-probe/release-candidate.json
          test "$(jq -r .commit "$metadata")" = "$GITHUB_SHA" || {
            echo "::error::Candidate metadata commit does not match $GITHUB_SHA"
            exit 1
          }
          test "$(jq -r .version "$metadata")" = "$VERSION" || {
            echo "::error::Candidate metadata version does not match $VERSION"
            exit 1
          }
          test "$(jq -r .signing_public_key "$metadata")" = "${SIGNING_PUBLIC_KEY,,}" || {
            echo "::error::Candidate applications were not built with the configured release public key"
            exit 1
          }

      - name: Sign and cryptographically verify Recon component
        shell: bash
        env:
          SIGNING_PRIVATE_SEED: ${{ secrets.signing_private_seed }}
          SIGNING_PUBLIC_KEY: ${{ inputs.signing_public_key }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          test "${#SIGNING_PRIVATE_SEED}" -eq 64 || {
            echo "::error::RECON_SIGNING_PRIVATE_SEED must contain exactly 64 hexadecimal characters"
            exit 1
          }
          test "${#SIGNING_PUBLIC_KEY}" -eq 64 || {
            echo "::error::RECON_SIGNING_PUBLIC_KEY must contain exactly 64 hexadecimal characters"
            exit 1
          }
          [[ "$SIGNING_PRIVATE_SEED" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo "::error::RECON_SIGNING_PRIVATE_SEED is not valid hexadecimal"
            exit 1
          }
          [[ "$SIGNING_PUBLIC_KEY" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo "::error::RECON_SIGNING_PUBLIC_KEY is not valid hexadecimal"
            exit 1
          }

          mkdir candidate-linux
          tar -xzf artifacts/release-candidate-linux-x86_64/polyglid-linux-x86_64.tar.gz -C candidate-linux
          cli=candidate-linux/polyglid
          component=artifacts/release-candidate-recon-probe/recon-probe.component.wasm
          key_file="$RUNNER_TEMP/recon-signing-seed"
          printf '%s' "$SIGNING_PRIVATE_SEED" > "$key_file"
          chmod 600 "$key_file"
          "$cli" plugin sign "$component" --key "$key_file"
          signature="${component%.wasm}.sig"
          test "$(jq -r .key_id "$signature")" = "${SIGNING_PUBLIC_KEY,,}" || {
            echo "::error::The configured public key does not match the signing seed"
            exit 1
          }
          "$cli" plugin verify "$component"
          "$cli" plugin inspect "$component" | tee plugin-metadata.txt
          grep -F "id: polyglid.recon_probe" plugin-metadata.txt
          grep -F "version: $VERSION" plugin-metadata.txt
          grep -F -- "- dns-resolve" plugin-metadata.txt
          grep -F -- "- report-write (path-prefix=reports)" plugin-metadata.txt

      - name: Collect assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          cp artifacts/release-candidate-linux-x86_64/polyglid-linux-x86_64.tar.gz release-assets/
          cp artifacts/release-candidate-windows-x86_64/polyglid-windows-x86_64.zip release-assets/
          cp artifacts/release-candidate-macos-x86_64/polyglid-macos-x86_64.tar.gz release-assets/
          cp artifacts/release-candidate-macos-aarch64/polyglid-macos-aarch64.tar.gz release-assets/
          cp artifacts/release-candidate-recon-probe/recon-probe.component.wasm release-assets/
          cp artifacts/release-candidate-recon-probe/recon-probe.component.sig release-assets/
          cp artifacts/release-candidate-recon-probe/recon-probe.component.polyglid.toml release-assets/
          cd release-assets
          sha256sum polyglid-* recon-probe.component.wasm recon-probe.component.sig recon-probe.component.polyglid.toml > SHA256SUMS

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          expected=(
            polyglid-linux-x86_64.tar.gz
            polyglid-windows-x86_64.zip
            polyglid-macos-x86_64.tar.gz
            polyglid-macos-aarch64.tar.gz
            recon-probe.component.wasm
            recon-probe.component.sig
            recon-probe.component.polyglid.toml
            SHA256SUMS
          )

          verify_assets() {
            local assets
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for name in "${expected[@]}"; do
              grep -Fxq "$name" <<<"$assets" || return 1
            done
          }

          state=missing
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              state=draft
            else
              state=published
            fi
          fi

          if [ "$state" = "published" ]; then
            verify_assets || {
              echo "::error::Published release $TAG is missing one or more required assets"
              exit 1
            }
            echo "Release $TAG is already complete"
            exit 0
          fi

          if [ "$state" = "missing" ]; then
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "PolyGlid $TAG"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          verify_assets || {
            echo "::error::Draft release $TAG is missing one or more required assets"
            exit 1
          }
          gh release edit "$TAG" --draft=false

      - name: Verify latest-release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          latest=
          for attempt in 1 2 3 4 5 6; do
            latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            [ "$latest" = "$TAG" ] && break
            sleep $((attempt * 2))
          done
          test "$latest" = "$TAG" || {
            echo "::error::Latest published release is ${latest:-unavailable}, expected $TAG"
            exit 1
          }
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for expected in \
            polyglid-linux-x86_64.tar.gz \
            polyglid-windows-x86_64.zip \
            polyglid-macos-x86_64.tar.gz \
            polyglid-macos-aarch64.tar.gz \
            recon-probe.component.wasm \
            recon-probe.component.sig \
            recon-probe.component.polyglid.toml \
            SHA256SUMS; do
            grep -Fxq "$expected" <<<"$assets" || {
              echo "::error::Release asset $expected is missing"
              exit 1
            }
          done
