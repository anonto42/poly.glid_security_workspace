name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: polyglid-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Detect version and prepare release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
            archive: polyglid-linux-x86_64.tar.gz
          - os: windows-latest
            asset: windows-x86_64
            archive: polyglid-windows-x86_64.zip
          - os: macos-15
            asset: macos-aarch64
            archive: polyglid-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-desktop-dependencies.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.asset }}
      - name: Build desktop
        run: cargo build --locked --release -p polyglid-desktop
      - name: Package Unix desktop
        if: runner.os != 'Windows'
        run: scripts/release/package-unix.sh ${{ matrix.archive }}
      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/package-windows.ps1 -Archive ${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified assets
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: scripts/release/publish.sh
